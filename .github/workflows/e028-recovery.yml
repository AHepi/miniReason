name: E028 recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Zero-call preflight or one bounded recovery occurrence
        required: true
        default: preflight
        type: choice
        options: [preflight, live]

permissions: {}
concurrency:
  group: e028-recovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash
env:
  PYTHONPATH: src
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact experiment dependencies
        run: python -m pip install 'jsonschema==4.25.1' 'referencing==0.37.0'
      - name: Initialize evidence directory
        run: mkdir -p work/e028-workflow
      - name: Check live dispatch boundary
        if: ${{ inputs.mode == 'live' }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            echo '::error::Live recovery requires a first-attempt dispatch from main.'
            exit 1
          fi
      - name: Report credential availability without reading its value
        env:
          E028_KEY_AVAILABLE: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          printf 'DEEPSEEK_API_KEY available: %s\n' "$E028_KEY_AVAILABLE" | tee work/e028-workflow/secret-availability.log
      - name: Run focused offline qualification
        run: |
          python -X utf8 -m unittest -v \
            tests.test_sql_use_return_study \
            tests.test_repo_activity \
            tests.test_sql_use_return_portable \
            tests.test_e028_checkpointed \
            2>&1 | tee work/e028-workflow/tests.log
      - name: Verify original frozen plan and rehearse all stages
        run: |
          python -X utf8 tools/run_e028_checkpointed.py --mode preflight --repo . \
            2>&1 | tee work/e028-workflow/preflight.log
      - name: Upload preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e028-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/e028-workflow/
            work/e028-preflight/
          if-no-files-found: warn
          retention-days: 30

  live:
    if: ${{ inputs.mode == 'live' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact experiment dependencies
        run: python -m pip install 'jsonschema==4.25.1' 'referencing==0.37.0'
      - name: Recheck first-attempt main dispatch
        run: |
          mkdir -p work/e028-workflow
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            echo '::error::Live recovery requires a first-attempt dispatch from main.'
            exit 1
          fi
          if [[ "$(git branch --show-current)" != 'main' ]]; then
            git switch --create main
          fi
      - name: Recheck frozen plan and filesystem before credential use
        run: |
          python -X utf8 tools/run_e028_checkpointed.py --mode preflight --repo . \
            2>&1 | tee work/e028-workflow/live-preflight.log
      - name: Run one checkpointed six-call occurrence
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -X utf8 tools/run_e028_checkpointed.py --mode live --repo . \
            2>&1 | tee work/e028-workflow/live.log
      - name: Preserve complete or interrupted evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e028-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/e028-workflow/
            work/e028-preflight/
            experiments/records/E028-sql-use-return-recovery-01/
            docs/DECISION_LEDGER.md
            docs/AGENT_ACTIVITY.jsonl
          if-no-files-found: warn
          retention-days: 30
