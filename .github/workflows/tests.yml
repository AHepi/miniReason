name: Tests

# Offline gate only. No secret is referenced and no step can reach a provider.
# The paid E028 recovery route stays in its own workflow_dispatch workflow.
on:
  push:
  pull_request:

permissions: {}
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its declared dependencies
        run: python -m pip install -e .
      - name: Run the complete offline suite
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Run the Lean declaration guard
        run: python -X utf8 scripts/test_lean_guard.py
