[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minireason"
version = "0.1.0"
description = "A standalone Mini reasoning harness and ECS experiment laboratory"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1", "referencing==0.37.0"]

[project.scripts]
minireason = "minireason.campaign:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"creib.forge.mini" = ["data/schema/*.json", "data/policies/*.json"]
"creib.forge.conformance" = ["data/schema/*.json"]
